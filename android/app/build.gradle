plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'kr.co.kac.airtalk'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.co.kac.airtalk'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.4.4'
    }

    // 사이드로드(태블릿·폰 직접 설치) 서명 — 같은 키로 서명해야 덮어쓰기 업데이트가 된다.
    // 키는 repo 에 두지 않는다: CI 는 GitHub Secrets(ANDROID_KEYSTORE_B64·ANDROID_KEYSTORE_PASSWORD)를
    // 파일로 풀어 아래 환경변수로 넘긴다. 로컬 빌드도 같은 환경변수를 지정한다(없으면 미서명 APK).
    def ksPath = System.getenv('ANDROID_KEYSTORE')
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storeType 'pkcs12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'airtalk'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD') // PKCS12 는 키 비밀번호 = 저장소 비밀번호
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "AirTalk-${variant.versionName}-android.apk"
        }
    }
}
