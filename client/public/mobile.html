<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#FFFFFF" />
<title>AirTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* 라이트 테마 전용(다크 모드·테마 토글 삭제). --k = 글자 크기 배율(헤더 A−/A+) */
  :root { --bg:#FFFFFF; --panel:#F7F6F2; --line:rgba(31,30,29,.12); --txt:#1F1E1D; --muted:#6B6A63; --accent:#1F5BBF; --accent2:#22c55e;
    --k:1; --fs:20px; --seg:#EFEEE9;
    --bubStaff:#EEF1FD; --bubStaffFg:#2B3A9E; --bubSelf:#F1F1F3; --bubSelfFg:#1F1E1D; }
  * { box-sizing:border-box; }
  html { color-scheme:light; }
  body { margin:0; font-family:'Noto Sans KR',system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--txt); -webkit-text-size-adjust:100%; }
  button { font-family:inherit; -webkit-tap-highlight-color:transparent; }
  header { position:sticky; top:0; z-index:6; background:var(--bg); padding:10px 16px 12px; border-bottom:1px solid rgba(31,30,29,.08); }
  /* 헤더 한 줄: 라이브 점 + 세션명(말줄임) | A− A+ 듣기 QR */
  .htop { display:flex; align-items:center; gap:8px; min-height:40px; }
  .stitle { flex:1; min-width:0; font-size:16px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .iconbtn { flex:none; width:40px; height:40px; padding:0; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--txt); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s, border-color .15s, color .15s; }
  .iconbtn svg { width:20px; height:20px; }
  .iconbtn:active { transform:scale(.96); }
  .iconbtn:disabled { opacity:.38; cursor:default; transform:none; }
  .iconbtn:focus-visible, .seg button:focus-visible, .sheet button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .iconbtn .aa { font-size:16px; font-weight:800; line-height:1; letter-spacing:-.02em; }
  .iconbtn .aa small { font-size:13px; font-weight:800; margin-left:1px; }
  /* 듣기: 켜짐=파란 채움+흰 스피커(파동) / 꺼짐=회색 스피커(X) */
  #audioBtn { color:var(--muted); }
  #audioBtn .icoOn { display:none; }
  #audioBtn.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #audioBtn.on .icoOn { display:block; }
  #audioBtn.on .icoOff { display:none; }
  /* 내 언어 세그먼트(양방향: 두 언어 — 라벨 없이 각 언어를 그 언어로 표기) */
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; height:48px; padding:4px; margin-top:10px; border-radius:14px; background:var(--seg); }
  .seg[hidden] { display:none; }
  .seg button { min-width:0; padding:0 8px; border:0; border-radius:10px; background:transparent; color:var(--muted); font-size:15px; font-weight:600; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:background .15s, color .15s, box-shadow .15s; }
  .seg button[aria-checked="true"] { background:#fff; color:var(--txt); font-weight:800; box-shadow:0 1px 2px rgba(31,30,29,.10), 0 1px 4px rgba(31,30,29,.06); }

  #feed { display:flex; flex-direction:column; gap:10px; padding:16px 16px 4px; }
  .msg { max-width:92%; }
  .msg .spk { display:inline-flex; align-items:center; gap:3px; font-size:calc(var(--fs) - 8px); font-weight:800; color:#fff; background:var(--accent); border-radius:10px; padding:1px 8px; margin-bottom:3px; }
  .msg .spk svg { width:13px; height:13px; }
  .msg .line { font-size:var(--fs); line-height:1.5; color:var(--txt); overflow-wrap:anywhere; }
  .msg .line.pending { color:var(--muted); font-style:italic; }
  .msg.latest .line { color:var(--accent); font-weight:700; }
  .msg.latest .line.pending { color:var(--muted); font-weight:400; }
  /* 양방향: 언어1 발화=액센트 / 언어2 발화=무채색 (최신 강조보다 우선) */
  .msg.dirA .line:not(.pending) { color:var(--accent); }
  .msg.dirB .line:not(.pending) { color:var(--txt); }
  /* 진행 중(미확정) 발화·번역 — 확정되면 draft 가 빠지며 본래 색으로 또렷해진다.
     latest/dirA/dirB·말풍선 규칙보다 뒤에 두고 셀렉터를 같은(이상) 특이도로 맞춰 확실히 이긴다. */
  .msg .line.draft, .msg.latest .line.draft, .msg.dirA .line.draft, .msg.dirB .line.draft { color:var(--muted); font-weight:400; }
  /* 원문(작은 줄) — 항상 표시(토글 삭제). 표시 문장과 같으면 srcShown 이 숨긴다 */
  .msg .src { font-size:calc(var(--fs) - 5px); color:var(--muted); line-height:1.45; margin-top:3px; overflow-wrap:anywhere; }
  #partial { padding:4px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  #partial .line { font-size:var(--fs); color:var(--muted); font-style:italic; line-height:1.4; }
  .empty { color:var(--muted); text-align:center; padding:72px 20px; font-size:15px; }

  /* 말풍선(양방향·데스크): 상대 쪽=왼쪽(파랑) / 내 쪽=오른쪽(무채색). 위에 방향 라벨, 아래 원문·상대 언어 줄 */
  .msg.turn { max-width:100%; display:flex; flex-direction:column; margin-top:4px; }
  .msg.turn.staff { align-items:flex-start; }
  .msg.turn.self  { align-items:flex-end; }
  .msg.turn .who { font-size:calc(12px * var(--k)); font-weight:700; line-height:1.3; margin:0 6px 5px; }
  .msg.turn.staff .who { color:#1F5BBF; }
  .msg.turn.self  .who { color:#6B6A63; }
  .msg.turn .line { max-width:88%; padding:11px 15px; font-size:calc(19px * var(--k)); font-weight:700; line-height:1.45; overflow-wrap:anywhere; }
  .msg.turn.staff .line { background:var(--bubStaff); color:var(--bubStaffFg); border-radius:6px 18px 18px 18px; }
  .msg.turn.self  .line { background:var(--bubSelf);  color:var(--bubSelfFg);  border-radius:18px 6px 18px 18px; }
  .msg.turn.staff .line.pending, .msg.turn.self .line.pending { opacity:.6; font-style:normal; }
  .msg.turn.staff .line.draft, .msg.turn.self .line.draft { color:var(--muted); font-weight:400; }
  .msg.turn .src { max-width:88%; margin:6px 8px 0; font-size:calc(14px * var(--k)); color:#6B6A63; line-height:1.45; }
  .msg.turn.self .src { text-align:right; }
  /* 한국어 줄만 어절 단위 줄바꿈(일·중에 keep-all 을 걸면 구두점 앞에서 끊기는 등 줄바꿈이 깨진다) — lang 은 renderLine 이 단다 */
  .msg.turn .line[lang|="ko"], .msg.turn .src[lang|="ko"] { word-break:keep-all; }
  /* 길안내: 채팅 인라인이 아니라 화면 '상단' 고정 플로팅 — 새 발화가 이어져도 밀려나지 않음 */
  .mapCard { position:fixed; top:calc(env(safe-area-inset-top, 0px) + 12px); left:12px; right:12px; z-index:60; margin:0;
    border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--panel);
    box-shadow:0 14px 44px rgba(0,0,0,.28); }
  .mapCard .mHead { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
  .mapCard .mHead .mIco { color:var(--accent); display:inline-flex; flex:0 0 auto; }
  .mapCard .mHead .mName { font-weight:800; font-size:calc(var(--fs) - 3px); color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mapCard .mHead .mChips { margin-left:auto; display:flex; gap:6px; flex:0 0 auto; }
  .mapCard .mHead .chip { background:var(--bg); border:1px solid var(--line); color:var(--muted); font-size:12px; font-weight:700; padding:3px 9px; border-radius:14px; white-space:nowrap; }
  .mapCard .mHolder { height:300px; overflow:hidden; }

  /* QR 공유 시트(설정 시트 대체) — 다른 사람이 스캔해 같은 번역에 들어오게 */
  .backdrop { position:fixed; inset:0; z-index:20; background:rgba(31,30,29,.42); opacity:0; pointer-events:none; transition:opacity .2s; }
  .backdrop.show { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; max-width:480px; margin:0 auto; background:#fff; border-radius:22px 22px 0 0;
    padding:10px 20px calc(22px + env(safe-area-inset-bottom, 0px)); text-align:center; box-shadow:0 -8px 30px rgba(31,30,29,.12);
    transform:translateY(105%); visibility:hidden; transition:transform .24s cubic-bezier(.2,.8,.2,1), visibility 0s linear .24s; }
  .sheet.show { transform:translateY(0); visibility:visible; transition:transform .24s cubic-bezier(.2,.8,.2,1), visibility 0s; }
  .sheet .grab { width:36px; height:4px; border-radius:2px; background:rgba(31,30,29,.16); margin:0 auto 16px; }
  .sheet h3 { margin:0; padding:0 44px; font-size:18px; font-weight:800; }
  .sheet .hint { margin:6px 0 16px; font-size:14px; color:var(--muted); line-height:1.5; word-break:keep-all; }
  .qrx { position:absolute; top:12px; right:12px; width:36px; height:36px; padding:0; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .qrx svg { width:18px; height:18px; }
  .qrframe { width:232px; height:232px; margin:0 auto; padding:10px; border:1px solid var(--line); border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center; }
  .qrframe img { width:100%; height:100%; display:block; }
  .qrframe img[hidden], .qrframe .qmsg[hidden] { display:none; }
  .qrframe .qmsg { padding:0 12px; font-size:13px; color:var(--muted); line-height:1.5; }
  .qlink { display:flex; align-items:center; gap:8px; margin-top:16px; }
  .qlink input { flex:1; min-width:0; height:46px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--txt); font-family:inherit; font-size:13px; }
  .qlink .copy { flex:none; height:46px; padding:0 16px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .qlink .copy.done { background:#2B3A9E; }

  /* 짧은 알림(글자 크기 %) */
  #toast { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom, 0px)); z-index:50; transform:translate(-50%, 8px); opacity:0; pointer-events:none;
    background:#1F1E1D; color:#fff; font-size:14px; font-weight:700; padding:9px 14px; border-radius:12px; transition:opacity .18s, transform .18s; white-space:nowrap; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }

  /* 라이브 상태 표시등(초록=진행 중 / 회색=대기) */
  #liveDot { width:8px; height:8px; border-radius:50%; background:#C9C7BF; flex:none; transition:background .2s, box-shadow .2s; }
  #liveDot.on { background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.18); }
  /* 입장 랜딩 */
  #landing { position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; }
  #landing.hide { display:none; }
  #landing .lcard { width:100%; max-width:340px; text-align:center; }
  #landing .lbrand { display:inline-flex; align-items:center; gap:8px; color:var(--accent); font-weight:800; font-size:15px; margin-bottom:22px; }
  #landing .ltitle { font-size:24px; font-weight:800; line-height:1.3; word-break:keep-all; }
  #landing .lmeta { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px; color:var(--muted); font-size:14px; font-weight:600; }
  #landing .lmeta .d { width:8px; height:8px; border-radius:50%; background:#C9C7BF; }
  #landing .lmeta .d.on { background:#22c55e; }
  #enterBtn { margin-top:30px; width:100%; padding:15px; border:none; border-radius:14px; background:var(--accent); color:#fff; font-family:inherit; font-size:17px; font-weight:800; cursor:pointer; }
  /* 오프라인 안내 배너 — 연결이 끊긴 줄 모르고 대기하는 문제 방지 */
  #netBanner { display:none; position:fixed; top:0; left:0; right:0; z-index:80; background:#e8912d; color:#fff;
    text-align:center; padding:7px 10px calc(7px + env(safe-area-inset-top, 0px)); font-size:13px; font-weight:700; }
  #netBanner.show { display:block; }
</style>
</head>
<body>
<div id="landing">
  <div class="lcard">
    <div class="lbrand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19V9M10 19V5M15 19v-7M20 19v-4"/></svg><span id="lBrandName">AirTalk</span></div>
    <div class="ltitle" id="lTitle">Session</div>
    <div class="lmeta"><span class="d" id="lLiveDot"></span><span id="lLive">Waiting</span></div>
    <button id="enterBtn">Enter</button>
  </div>
</div>
<header>
  <div class="htop">
    <span id="liveDot" role="img" aria-label="Waiting"></span>
    <div class="stitle" id="title">Session</div>
    <button class="iconbtn" id="fsDown" aria-label="Smaller text"><span class="aa" aria-hidden="true">A<small>−</small></span></button>
    <button class="iconbtn" id="fsUp" aria-label="Larger text"><span class="aa" aria-hidden="true">A<small>+</small></span></button>
    <button class="iconbtn" id="audioBtn" aria-label="Listen" aria-pressed="false" style="display:none">
      <svg class="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
      <svg class="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
    <button class="iconbtn" id="qrBtn" aria-label="Share via QR code" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM21 14v.01M17 21h.01M21 17v4h-4"/></svg>
    </button>
  </div>
  <div class="seg" id="langSeg" role="radiogroup" aria-label="My language" hidden></div>
</header>

<div id="feed"><div class="empty" id="empty">Waiting for translation…</div></div>
<div id="partial"></div>

<!-- QR 공유 시트 -->
<div class="backdrop" id="qrBackdrop"></div>
<div class="sheet" id="qrSheet" role="dialog" aria-modal="true" aria-labelledby="qrTitle" aria-hidden="true">
  <div class="grab" aria-hidden="true"></div>
  <button class="qrx" id="qrClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h3 id="qrTitle">Scan to join</h3>
  <p class="hint" id="qrHint"></p>
  <div class="qrframe"><img id="qrImg" alt="QR" hidden /><span class="qmsg" id="qrMsg"></span></div>
  <div class="qlink">
    <input id="qrLink" type="text" readonly />
    <button class="copy" id="qrCopy">Copy link</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const params = new URLSearchParams(location.search);
const sessionId = params.get('session') || 'default';
const token = params.get('t') || ''; // 뷰어 접근 토큰(QR 에 포함) — 공개 라우트 접근에 필요
const tq = token ? ('&t=' + encodeURIComponent(token)) : ''; // ws/qr 쿼리용
const tq1 = token ? ('?t=' + encodeURIComponent(token)) : ''; // 첫 쿼리(REST)용
const ALL4 = ['ko','en','ja','zh'];
// 언어 자기 표기(endonym) 폴백 — Intl.DisplayNames 미지원·실패 시
const LABEL = { ko:'한국어', en:'English', ja:'日本語', zh:'中文', es:'Español', fr:'Français', de:'Deutsch', ru:'Русский', vi:'Tiếng Việt', th:'ไทย', id:'Bahasa Indonesia', pt:'Português', it:'Italiano', ar:'العربية', hi:'हिन्दी', tr:'Türkçe', uk:'Українська', pl:'Polski', nl:'Nederlands' };

const $ = (id) => document.getElementById(id);
const feed=$('feed'), empty=$('empty'), partialEl=$('partial'), langSeg=$('langSeg'), titleEl=$('title');
const cards = new Map(); // id -> {el, line, src, texts, source}
let order = []; // 표시 순서 id 목록
let latestId = null;
let curLang = 'ko';
let langKnown = false; // curLang 이 세션 정보로 정해졌는지 — 그 전엔 화면 문구를 폰 언어로
let sessionPipeline = 'whisper';
let sessionOutLang = 'ko';
let sxTwo = false, sxAlang = null, sxBlang = null; // 양방향 번역(언어1↔언어2) — 방향별 색상
let segPair = null; // 세그먼트에 깔린 언어 목록('ko,ja') — 같으면 다시 그리지 않고 선택만 맞춘다
// 양방향: 이 뷰어의 '내 언어'(둘 중 하나). 내 언어로 말한 쪽은 오른쪽에 원문, 상대 언어 쪽은 왼쪽에 내 언어 번역.
// 음성 듣기도 내 언어 음성만 받는다(서버 audioSub.lang). 처음엔 폰 언어로 추정, 고르면 세션별로 기억.
function pickMyLang(a, b){
  try { const sv = localStorage.getItem('kac-mylang-'+sessionId); if (sv === a || sv === b) return sv; } catch {}
  const nav = String(navigator.language || '').slice(0,2).toLowerCase();
  return nav === b ? b : a;
}
let speakerNames = {}; // 화자번호 -> 지정이름
function spkLabel(id){ return id ? (speakerNames[id] || ('Speaker '+id)) : ''; }

/* ---- 화면 문구(UI 언어) ----
   양방향: 내 언어를 따르되 한·일·영만 지원 — 그 외 언어는 영어.
   단방향: 표시 중인 출력 언어가 한·일·영이면 그 언어, 아니면 폰 언어(한·일·영일 때), 그래도 아니면 영어. */
const UI_LANGS = ['ko','ja','en'];
const UI = {
  waiting:  { ko:'번역을 기다리는 중…', ja:'翻訳を待っています…', en:'Waiting for translation…' },
  live:     { ko:'진행 중', ja:'配信中', en:'Live' },
  idle:     { ko:'대기 중', ja:'待機中', en:'Waiting' },
  enter:    { ko:'입장하기', ja:'参加する', en:'Enter' },
  fsDown:   { ko:'글자 작게', ja:'文字を小さく', en:'Smaller text' },
  fsUp:     { ko:'글자 크게', ja:'文字を大きく', en:'Larger text' },
  fsVal:    { ko:'글자 크기', ja:'文字サイズ', en:'Text size' },
  listen:   { ko:'음성 듣기', ja:'音声を聞く', en:'Listen' },
  qr:       { ko:'QR 코드로 공유', ja:'QRコードで共有', en:'Share via QR code' },
  myLang:   { ko:'내 언어', ja:'自分の言語', en:'My language' },
  qrTitle:  { ko:'QR로 함께 보기', ja:'QRコードで参加', en:'Scan to join' },

/* ---- 언어 이름 ----
   endonym: 세그먼트용 — 각 언어를 그 언어로(한국어 / 日本語 / English …)
   langName: 말풍선 방향 라벨용 — UI 언어로(일본어 → 한국어 / 韓国語 → 日本語 / Korean → Japanese) */
const LNAME = {
  ko: { ko:'한국어', en:'영어', ja:'일본어', zh:'중국어', es:'스페인어', fr:'프랑스어', de:'독일어', ru:'러시아어', vi:'베트남어', th:'태국어', id:'인도네시아어' },
  ja: { ko:'韓国語', en:'英語', ja:'日本語', zh:'中国語', es:'スペイン語', fr:'フランス語', de:'ドイツ語', ru:'ロシア語', vi:'ベトナム語', th:'タイ語', id:'インドネシア語' },
  en: { ko:'Korean', en:'English', ja:'Japanese', zh:'Chinese', es:'Spanish', fr:'French', de:'German', ru:'Russian', vi:'Vietnamese', th:'Thai', id:'Indonesian' },
};
const ENDO_PREF = { id:'Bahasa Indonesia' }; // CLDR 은 'Indonesia' — 현지에서 흔히 쓰는 표기로
const dnCache = {};
function intlName(code, inLang){
  try {
    if (!window.Intl || !Intl.DisplayNames) return '';
    const dn = dnCache[inLang] || (dnCache[inLang] = new Intl.DisplayNames([inLang], { type:'language' }));
    const s = dn.of(code);
    return (s && s.toLowerCase() !== String(code).toLowerCase()) ? s : ''; // 모르는 코드는 코드 그대로 돌려준다 → 폴백
  } catch { return ''; }
}
function cap1(s, loc){ if (!s) return s; let h; try { h = s.charAt(0).toLocaleUpperCase(loc); } catch { h = s.charAt(0).toUpperCase(); } return h + s.slice(1); }
function endonym(code){
  const c = String(code || ''), b = c.slice(0,2).toLowerCase();
  if (ENDO_PREF[c]) return ENDO_PREF[c];
  return cap1(intlName(c, c) || LABEL[c] || LABEL[b] || c.toUpperCase(), c);
}
function langName(code){
  if (!code) return '';
  const ui = uiLang(), c = String(code), b = c.slice(0,2).toLowerCase();
  const s = intlName(c, ui) || (LNAME[ui][c] || LNAME[ui][b]) || c.toUpperCase();
  return ui === 'en' ? cap1(s, 'en') : s;
}

let segOnPick = null;

}

}

function applySxInfo(info){
  // 언어쌍 문구 표시는 제거 — 표시할 언어(curLang)만 갱신
  if (!info) { rerender(); return; }

    if (sessionPipeline === 'desk') { curLang = info.b; langKnown = true; } // 데스크 뷰어=손님 언어
    else {
      // 일반 양방향: 내 언어를 고를 수 있게(두 언어 중 하나) — 정렬·번역·음성·화면 문구가 이 기준
      sxTwo = true; sxAlang = info.a; sxBlang = info.b;
      curLang = (curLang === info.a || curLang === info.b) && segPair === info.a+','+info.b ? curLang : pickMyLang(info.a, info.b);
      langKnown = true;
      buildSeg([info.a, info.b], (c) => {
        curLang = c; try { localStorage.setItem('kac-mylang-'+sessionId, curLang); } catch {}
        syncSeg(); rerender(); sendAudioSub(audioOn);
      });
      sendAudioSub(audioOn); // 듣는 중이었다면 내 언어 기준으로 다시 구독
    }
  } else {
    curLang = (sessionPipeline === 'desk') ? 'ko' : info.target;
    langKnown = true;
    sxTwo = false;
    if (sessionPipeline !== 'desk' && segPair) hideSeg();
  }
  rerender();
}

  try { const s = await fetch('/api/sessions/'+sessionId+tq1).then(r=>r.json()); if (s){ if(s.title) title = s.title; if(s.pipeline) sessionPipeline = s.pipeline; if(s.outLang) sessionOutLang = s.outLang; sxInfo = s.sxInfo || null; speakerNames = s.speakers || {}; } }
  catch { setTimeout(loadSession, 5000); }

function pick(texts){
  if(!texts) return '';
  if(texts[curLang]) return texts[curLang];
  if(sessionPipeline === 'translate' || sessionPipeline === 'soniox'){ const k=Object.keys(texts); if(k.length) return texts[k[0]]; }
  return '';
}
function atBottom(){ return document.body.scrollHeight - window.scrollY - window.innerHeight < 160; }
function scrollDown(){ window.scrollTo(0, document.body.scrollHeight); }

function upsert(item){
  // 에코 드랍(clearCard): 서버가 빈 페이로드를 보내면 카드를 제거 — 빈 줄이 남아 최신 강조가 걸리던 문제(TranslateView·desk 와 동일 규약)
  const hasPayload = !!(item.source || item.text || (item.texts && Object.values(item.texts).some(Boolean)));
  if(!hasPayload){
    const c0 = cards.get(item.id);
    if(c0){ try { c0.el.remove(); } catch {} cards.delete(item.id); order = order.filter(x=>x!==item.id); if(latestId===item.id) latestId=null; }
    return;
  }
  if(empty) empty.style.display='none';
  const stick = atBottom();
  let card = cards.get(item.id);
  if(!card){
    const el=document.createElement('div'); el.className='msg';
    const spk=document.createElement('div'); spk.className='spk'; el.appendChild(spk);
    const line=document.createElement('div'); line.className='line'; line.dir='auto'; el.appendChild(line);
    const src=document.createElement('div'); src.className='src'; src.dir='auto'; el.appendChild(src);
    feed.appendChild(el);
    card={el, line, src, spk}; cards.set(item.id, card); order.push(item.id);
    // 최신 강조 이동
    if(latestId && cards.get(latestId)) cards.get(latestId).el.classList.remove('latest');
    el.classList.add('latest'); latestId = item.id;
    // 장시간 세션 메모리·렌더 보호: 오래된 카드는 화면에서 제거(전문은 서버 세션에 보존)
    while(order.length > 300){
      const oldId = order.shift();
      const old = cards.get(oldId);
      if(old){ try { old.el.remove(); } catch {} cards.delete(oldId); }
    }
  }
  card.texts = item.texts || (item.text ? { [curLang]: item.text } : {});
  card.source = item.source || '';
  if (item.lang) card.lang = item.lang; // 발화 언어 — 양방향 정렬(내 언어 쪽/상대 쪽)
  // 확정 메시지는 draft 를 아예 안 보내므로 매번 덮어써야 한다(유지하면 영영 흐린 채로 남는다)
  card.draft = !!item.draft;
  if(item.speaker) card.speaker = item.speaker;
  renderSpk(card);
  renderLine(card); // 보조 줄(원문/번역)까지 renderLine 이 채운다
  if(stick) scrollDown();
}
function esc(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
// 화자 구분 표시 제거. 양방향·데스크는 같은 자리(.who)를 방향/역할 라벨로 쓰므로 건드리지 않는다
// (예전엔 speakers 메시지가 오면 그 라벨까지 숨겨졌다)
function renderSpk(c){ if(!c.spk || c.spk.className === 'who') return; c.spk.style.display='none'; }
function rerenderSpk(){ cards.forEach(renderSpk); }
// 선택 언어 번역이 아직 없으면 원문을 흐리게(placeholder)
function renderLine(c){
  if (isDesk()){
    const r = deskTextOf(c);
    c.el.classList.add('turn');
    c.el.classList.toggle('staff', r.staff);
    c.el.classList.toggle('self', !r.staff);
    c.el.classList.remove('latest');
    if (c.spk){ c.spk.className = 'who'; c.spk.style.display = r.t ? '' : 'none'; c.spk.textContent = r.staff ? dt('staff') : (dt('you') + ' · ' + String(curLang).toUpperCase()); }
    c.line.className = 'line' + (c.draft ? ' draft' : ''); // className 통째 교체라 여기서 같이 얹는다
    c.line.textContent = r.t;
    if (c.src) c.src.style.display = 'none';
    c.el.style.display = r.t ? '' : 'none';
    return;
  }
  if (twoMode()) {
    // 발화 언어: 서버가 보낸 lang, 없으면 번역 키로 추정(번역 키=상대 언어 → 말한 언어는 그 반대)
    const tk = c.texts ? Object.keys(c.texts)[0] : null;
    const spoken = c.lang || (tk ? (tk === sxAlang ? sxBlang : sxAlang) : null);
    const mine = spoken === curLang;
    const other = curLang === sxAlang ? sxBlang : sxAlang;
    const tr = c.texts ? (c.texts[mine ? other : curLang] || '') : '';
    let main = mine ? (c.source || tr) : tr;
    const pending = !main && !!c.source; // 상대 말인데 아직 내 언어 번역이 없음 → 원문을 흐리게
    if (pending) main = c.source;
    c.sub = mine ? tr : (pending ? '' : c.source);
    c.el.classList.add('turn');
    c.el.classList.toggle('self', mine);
    c.el.classList.toggle('staff', !mine);
    c.el.classList.remove('latest', 'dirA', 'dirB');
    // 방향 라벨 '말한 언어 → 번역 언어'(UI 언어로): 상대 쪽=말한 언어→내 언어, 내 쪽=내 언어→상대 언어
    const to = mine ? other : curLang;
    if (c.spk){ c.spk.className = 'who'; c.spk.style.display = main ? '' : 'none'; c.spk.textContent = spoken ? (langName(spoken) + ' → ' + langName(to)) : langName(to); }
    c.line.className = 'line' + (pending ? ' pending' : '') + (c.draft ? ' draft' : '');
    c.line.textContent = main;
    c.src.textContent = c.sub || '';
    // 줄마다 언어 표시 — 한국어만 어절 줄바꿈 + 한자 글꼴(일/중) 선택이 맞게
    c.line.lang = pending ? (spoken || '') : curLang;
    c.src.lang = mine ? (other || '') : (spoken || '');
    c.src.style.display = srcShown(c) ? 'block' : 'none';
    c.el.style.display = main ? '' : 'none';
    return;
  }
  // 단방향: 세션 도중 양방향→단방향으로 바뀌어도 말풍선·라벨이 남지 않게 원상 복구
  if (c.el.classList.contains('turn')) {
    c.el.classList.remove('turn', 'self', 'staff'); c.el.style.display = '';
    c.line.removeAttribute('lang'); c.src.removeAttribute('lang');
    if (c.spk) { c.spk.className = 'spk'; c.spk.style.display = 'none'; }
  }
  const txt = pick(c.texts);
  c.line.classList.toggle('pending', !txt && !!c.source);
  c.line.classList.toggle('draft', !!c.draft); // 진행 중 → 회색, 확정되면 제 색으로
  c.line.textContent = txt || c.source || '';
  // 원문은 번역 아래 작은 줄로 항상(표시 문장과 같으면 생략)
  c.src.textContent = c.source || '';
  c.src.style.display = srcShown(c) ? 'block' : 'none';
  // 양방향: 저장된 타깃 언어 키로 발화 방향 판별(언어1 발화→texts[언어2], 언어2 발화→texts[언어1])
  c.el.classList.remove('dirA', 'dirB');
  if (sxTwo && c.texts) {
    const tk = Object.keys(c.texts)[0];
    if (tk === sxBlang) c.el.classList.add('dirA');      // 타깃=언어2 → 언어1 발화
    else if (tk === sxAlang) c.el.classList.add('dirB'); // 타깃=언어1 → 언어2 발화
  }
}
// 언어를 바꾸면 화면 문구·방향 라벨 언어와 '원문=표시 문장' 여부도 바뀐다
function rerender(){ applyUi(); cards.forEach(renderLine); applySrc(); }
// 데스크: 대화 종료 시 화면 초기화(다음 손님)
function clearAll(){ cards.forEach(c=>c.el.remove()); cards.clear(); order=[]; latestId=null; setPartial(''); removeMap(); if(empty) empty.style.display=''; }
function setPartial(text){ const s=atBottom(); partialEl.innerHTML = text ? ('<div class="line">'+text.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>') : ''; if(s) scrollDown(); }

/* ---- 번역 음성 재생 (translate, 24kHz PCM16) ---- */
let audioOn = false;
let actx = null;
let outCursor = 0;
let mgain = null; // 마스터 게인(TTS 재생 경로)
function enableAudio(){
  // 모바일 자동재생 정책: 사용자 탭(제스처) 안에서 컨텍스트 생성/재개해야 소리가 남
  if(!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); mgain = actx.createGain(); mgain.connect(actx.destination); } catch {} }
  if(actx && actx.state==='suspended') actx.resume();
}
function sendAudioSub(on){ try { if(ws && ws.readyState===1) ws.send(JSON.stringify({type:'audioSub', on:!!on, ...(twoMode() ? { lang: curLang } : {})})); } catch {} }
function playPcm24(b64){
  if(!actx) return;
  try {
    const bin = atob(b64); const n = bin.length>>1;
    const buf = actx.createBuffer(1, n, 24000); const ch = buf.getChannelData(0);
    for(let i=0;i<n;i++){ let s=(bin.charCodeAt(i*2+1)<<8)|bin.charCodeAt(i*2); if(s>=0x8000) s-=0x10000; ch[i]=s/32768; }
    const node = actx.createBufferSource(); node.buffer=buf; node.connect(mgain || actx.destination);
    const now = actx.currentTime; if(outCursor<now) outCursor=now+0.08;
    node.start(outCursor); outCursor += buf.duration;
  } catch {}
}

/* ---- WS ---- */
let ws;
let refused = false; // 서버가 접속을 거부(정원 초과·IP 상한) — 재연결 중단 + 안내 유지
function connect(){
  // 이미 연결(중)이면 무시 — onclose 재시도와 visibilitychange 가 경합해 소켓이 병렬 누적되던 문제(TTS 이중 재생) 수정
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/viewer?session=${sessionId}${tq}`);
  const cur = ws;
  ws.onopen = () => {
    if(audioOn) sendAudioSub(true); // 재접속 시 구독 복원
  };
  ws.onclose = () => { if (ws === cur) { ws = null; if (!refused) setTimeout(connect, 1200 + Math.random() * 1200); } }; // 지터 — 서버 재시작 시 전체 뷰어 동시 재연결 폭주 방지
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; } // 비 JSON 프레임 방어
    // 서버가 접속을 거부(뷰어 정원 초과·동일 IP 상한): 이유를 보여주고 재연결을 멈춘다.
    // 이 분기가 없으면 거부된 폰이 아무 표시 없이 무한 재연결만 반복한다.
    if(m.type==='error'){ refused = true; setPartial({room_full:T('roomFull'),ip_limit:T('ipLimit')}[m.code] || m.message || T('cantConn')); try { cur.close(); } catch {} return; }
    if(m.type==='snapshot'){ m.items.forEach(it => upsert(it)); }
    else if(m.type==='partial'){ setPartial(m.text); }
    else if(m.type==='sentence'){ setPartial(''); upsert(m); }
    else if(m.type==='audio'){ if(audioOn) playPcm24(m.b64); }
    else if(m.type==='meta'){ if(sessionPipeline==='soniox' || sessionPipeline==='desk') applySxInfo(m.sxInfo); }
    else if(m.type==='wayfind'){ if(isDesk()) showWayfind(m); }
    else if(m.type==='desk-reset'){ clearAll(); }
    else if(m.type==='speakers'){ speakerNames = m.speakers || {}; rerenderSpk(); }
    else if(m.type==='host'){ setHostActive(m.active); }
  };
}
// 호스트(번역) 활성/중지 → 상태 표시등(초록/회색) + 랜딩
function setHostActive(active){
  hostActive = !!active;
  const lbl = hostActive ? T('live') : T('idle');
  $('liveDot').classList.toggle('on', hostActive); $('liveDot').title = lbl; $('liveDot').setAttribute('aria-label', lbl);
  const ld = $('lLiveDot'); if(ld) ld.classList.toggle('on', hostActive);
  const ll = $('lLive'); if(ll) ll.textContent = lbl;
}

/* ---- 헤더 버튼(설정 시트 삭제 — 글자 크기·QR 은 여기로, 원문은 항상 표시, 다크 모드 없음) ---- */
function stepFs(d){
  const s = atBottom();
  fsPct = Math.min(FS_MAX, Math.max(FS_MIN, fsPct + d)); applyFs();
  toast(T('fsVal') + ' ' + fsPct + '%');
  if (s) scrollDown(); // 맨 아래 보던 중이면 커진 글자에도 최신 문장이 보이게
}
$('fsDown').onclick = () => stepFs(-FS_STEP);
$('fsUp').onclick = () => stepFs(FS_STEP);
$('audioBtn').onclick = () => {
  audioOn = !audioOn; $('audioBtn').classList.toggle('on', audioOn); $('audioBtn').setAttribute('aria-pressed', audioOn ? 'true' : 'false');
  if(audioOn) enableAudio(); sendAudioSub(audioOn);
};
$('qrBtn').onclick = openQr;
$('qrClose').onclick = closeQr;
$('qrBackdrop').onclick = closeQr;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('qrSheet').classList.contains('show')) closeQr(); });
$('qrCopy').onclick = async () => {
  const link = $('qrLink').value;
  try { await navigator.clipboard.writeText(link); } catch { const i=$('qrLink'); i.select(); try { document.execCommand('copy'); } catch {} }
  const b=$('qrCopy'); b.classList.add('done'); b.textContent = T('copied');
  setTimeout(() => { b.classList.remove('done'); b.textContent = T('copy'); }, 1200);
};


// 화면 복귀(휴대폰 절전·앱 전환) 시 즉시 재접속 시도 — 재시도 타이머보다 빠르게 복구
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!ws || ws.readyState === 3)) { try { connect(); } catch {} }
  // TTS: 잠금/앱 전환으로 AudioContext 가 suspended/interrupted 되면 복귀 시 재개하고
  // 재생 커서를 리셋 — 잠금 시간만큼 밀린 옛 음성이 연달아 재생되던 문제 방지
  if (!document.hidden && audioOn && actx) {
    try { if (actx.state !== 'running') actx.resume(); } catch {}
    outCursor = 0; // 다음 청크부터 현재 시각 기준으로 다시 스케줄
  }
});
// 브라우저 오류 보고(관리자 시스템 상태) — 60초 스로틀
let __errAt = 0;
window.addEventListener('error', (e) => {
  const t = Date.now(); if (t - __errAt < 60000) return; __errAt = t;
  try { fetch('/api/client-log', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ msg: 'mobile: ' + e.message, src: (e.filename||'') + ':' + (e.lineno||0) }) }); } catch {}
});

applyUi();
applySrc();
loadSession();
loadQr();
connect();
</script>
<script>
/* 인터넷 연결 감지 — 끊기면 상단 배너, 복구되면 자동 숨김(WS 재연결 로직이 이어받음). 문구는 UI 언어(applyUi 가 갱신) */
(function(){
  var b = document.createElement('div'); b.id = 'netBanner'; b.setAttribute('role', 'status');
  b.textContent = (typeof T === 'function') ? T('offline') : 'No internet connection — will resume automatically once back online.';
  document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(b); if(!navigator.onLine) b.classList.add('show'); });
  window.addEventListener('offline', function(){ b.classList.add('show'); });
  window.addEventListener('online', function(){ b.classList.remove('show'); });
})();
</script>
