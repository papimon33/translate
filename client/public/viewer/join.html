<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#FFFFFF" />
<title>AirTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&text=airtlk%C4%B1.&display=block" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* 라이트 테마 전용. 폰 앱(호스트) 화면과 같은 모양(2026-10-26 디스코드 스타일): 흰 바탕 · 떠 있는 회색 조작판 · 보라 강조.
     --k = 글자 크기 배율(조작판 가−/가+) */
  :root { --bg:#FFFFFF; --panel:#F1F1F4; --line:rgba(31,30,29,.12); --txt:#1F1E1D; --muted:#6B6A63; --brand:#5B4FE8; --brandSoft:#EEEDFC;
    --accent:var(--brand); --blue:#1F5BBF; --k:1; --fs:22px;
    --bubOther:rgba(46,111,216,.10); --bubMine:rgba(31,30,29,.06); }
  * { box-sizing:border-box; }
  html { color-scheme:light; }
  body { margin:0; font-family:'Pretendard','Noto Sans KR',system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--txt); -webkit-text-size-adjust:100%; }
  button { font-family:inherit; -webkit-tap-highlight-color:transparent; }
  button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  /* 위: 라이브 점 + 세션 이름(표시만), 양방향이면 아래에 내 언어 세그먼트 */
  header { position:sticky; top:0; z-index:6; background:rgba(255,255,255,.96); padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; }
  .htop { display:flex; align-items:center; gap:4px; min-height:44px; padding-left:4px; }
  .htop #liveDot { margin-right:5px; }
  .stitle { flex:1; min-width:0; font-size:18px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; height:48px; padding:4px; margin-top:8px; border-radius:999px; background:var(--panel); }
  .seg[hidden] { display:none; }
  .seg button { min-width:0; padding:0 10px; border:0; border-radius:999px; background:transparent; color:var(--muted); font-size:15px; font-weight:700; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:background .15s, color .15s, box-shadow .15s; }
  .seg button[aria-checked="true"] { background:#fff; color:var(--txt); font-weight:800; box-shadow:0 1px 3px rgba(0,0,0,.12); }

  /* 대화 — 실시간 번역: 번역문(큰 글씨) + 원문(작은 회색) / 양방향: 말풍선(상대 왼쪽 파랑 · 나 오른쪽 회색) */
  #feed { display:flex; flex-direction:column; gap:20px; padding:16px 22px 4px; }
  .msg { max-width:100%; }
  .msg .spk { display:none; }
  .msg .line { font-size:var(--fs); font-weight:500; line-height:1.45; color:var(--txt); overflow-wrap:anywhere; }
  .msg .line.pending, .msg .line.draft { color:var(--muted); }
  .msg .src { font-size:calc(14.5px * var(--k)); color:var(--muted); line-height:1.5; margin-top:5px; overflow-wrap:anywhere; }
  .msg .line[lang|="ko"], .msg .src[lang|="ko"] { word-break:keep-all; }
  /* 언어별 글꼴: 한·영 Pretendard(기본), 일본어 Pretendard JP, 중국어 Noto Sans SC — 문장·언어 버튼·화면 언어(html lang)에 달린 lang 기준 */
  [lang|="ja"], [lang|="ja"] * { font-family: 'Pretendard JP Variable', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif !important; }
    [lang|="zh"], [lang|="zh"] * { font-family: 'Noto Sans SC', 'Pretendard', system-ui, sans-serif !important; }
  .msg.turn { display:flex; flex-direction:column; gap:6px; }
  .msg.turn.staff { align-items:flex-start; }
  .msg.turn.self  { align-items:flex-end; }
  .msg.turn .who { font-size:12px; font-weight:700; line-height:1.3; padding:0 6px; }
  .msg.turn.staff .who { color:var(--blue); }
  .msg.turn.self  .who { color:var(--muted); }
  .msg.turn .bub { max-width:86%; padding:12px 16px; display:flex; flex-direction:column; gap:4px; }
  .msg.turn.staff .bub { background:var(--bubOther); border-radius:6px 20px 20px 20px; }
  .msg.turn.self  .bub { background:var(--bubMine); border-radius:20px 6px 20px 20px; }
  .msg.turn .line { font-size:calc(19px * var(--k)); }
  .msg.turn .src { font-size:calc(13.5px * var(--k)); margin-top:0; }
  #partial { padding:4px 22px calc(28px + env(safe-area-inset-bottom, 0px)); }
  #partial .line { font-size:var(--fs); color:var(--muted); line-height:1.45; }
  .empty { color:var(--muted); text-align:center; padding:30vh 24px 0; font-size:15px; line-height:1.6; word-break:keep-all; }
  /* 우상단 아이콘 버튼(가− · 가+ · 듣기(헤드폰) · QR) — 폰 앱 우상단과 같은 모양: 배경 없이 아이콘만, 듣기 켜짐일 때만 옅은 보라 배경(꺼짐 = 사선) */
  .hbtn { flex:none; width:40px; height:40px; padding:0; border:0; border-radius:12px; background:transparent; color:var(--txt); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s, color .15s, opacity .15s; }
  .hbtn svg { width:22px; height:22px; }
  .hbtn:active { background:rgba(31,30,29,.06); }
  .hbtn:disabled { opacity:.35; cursor:default; background:transparent; }
  #audioBtn { color:var(--muted); }
  #audioBtn.on { background:var(--brandSoft); color:var(--brand); }
  #audioBtn.on .slash { display:none; }

  /* QR 공유 시트 — 앱의 바텀 시트와 같은 모양 */
  .backdrop { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s; }
  .backdrop.show { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; max-width:560px; margin:0 auto; background:#fff; border-radius:28px 28px 0 0;
    padding:10px 24px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow:0 -8px 30px rgba(31,30,29,.12);
    transform:translateY(105%); visibility:hidden; transition:transform .24s cubic-bezier(.2,.8,.2,1), visibility 0s linear .24s; }
  .sheet.show { transform:translateY(0); visibility:visible; transition:transform .24s cubic-bezier(.2,.8,.2,1), visibility 0s; }
  .sheet .grab { width:40px; height:4px; border-radius:999px; background:rgba(31,30,29,.12); margin:0 auto 14px; }
  .sheet h3 { margin:0; padding-right:44px; font-size:21px; font-weight:800; letter-spacing:-.015em; }
  .sheet .hint { margin:4px 0 16px; font-size:13.5px; color:var(--muted); line-height:1.5; word-break:keep-all; }
  .qrx { position:absolute; top:16px; right:16px; width:40px; height:40px; padding:0; border:0; border-radius:12px; background:var(--panel); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .qrx svg { width:18px; height:18px; }
  .qrframe { width:220px; height:220px; margin:0 auto; padding:8px; border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center; }
  .qrframe img { width:100%; height:100%; display:block; }
  .qrframe img[hidden], .qrframe .qmsg[hidden] { display:none; }
  .qrframe .qmsg { padding:0 12px; font-size:13px; color:var(--muted); line-height:1.5; text-align:center; }
  #qrCode { margin-top:12px; text-align:center; font-size:26px; font-weight:800; letter-spacing:.25em; color:var(--txt); }
  #qrCode[hidden] { display:none; }
  #qrLink { display:block; width:100%; margin-top:10px; padding:0; border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:12.5px; text-align:center; text-overflow:ellipsis; }
  #qrLink:focus { outline:none; }
  .qbtns { display:flex; gap:8px; margin-top:14px; }
  .qbtns button { flex:1; height:50px; border:0; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; }
  .qbtns .copy { background:rgba(31,30,29,.06); color:var(--txt); }
  .qbtns .copy.done { color:#007a5a; }
  .qbtns .share { background:var(--brand); color:#fff; }
  .qbtns .share[hidden] { display:none; }

  /* 짧은 알림(글자 크기 %) — 조작판 바로 위 */
  #toast { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom, 0px)); z-index:50; transform:translate(-50%, 8px); opacity:0; pointer-events:none;
    background:#323232; color:#fff; font-size:14px; font-weight:600; padding:10px 16px; border-radius:10px; transition:opacity .18s, transform .18s; white-space:nowrap; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }

  /* 라이브 상태 표시등(초록=진행 중 / 회색=대기) */
  #liveDot { width:8px; height:8px; border-radius:50%; background:#C9C7BF; flex:none; transition:background .2s, box-shadow .2s; }
  #liveDot.on { background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.18); }
  /* 입장 랜딩 */
  #landing { position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; }
  #landing.hide { display:none; }
  #landing .lcard { width:100%; max-width:340px; text-align:center; }
  /* 글자 로고 'airtalk.' — 폰 앱과 같은 Nunito 900 + 보라 마침표·보라 i 점(점 없는 ı 위에 보라 i 를 겹쳐 점만 남김, client/src/shared/Wordmark.jsx 와 같은 방식) */
  #landing .lbrand { font-family:'Nunito','Pretendard',system-ui,sans-serif; font-weight:900; font-size:40px; letter-spacing:-.02em; line-height:1; color:var(--txt); margin-bottom:28px; }
  #landing .lbrand .p { color:var(--brand); }
  #landing .lbrand .i { display:inline-grid; }
  #landing .lbrand .i > span { grid-area:1/1; }
  #landing .lbrand .i > span + span { color:var(--brand); clip-path:inset(0 0 .74em 0); }
  #landing .ltitle { font-size:24px; font-weight:800; line-height:1.3; word-break:keep-all; }
  #landing .lmeta { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px; color:var(--muted); font-size:14px; font-weight:600; }
  #landing .lmeta .d { width:8px; height:8px; border-radius:50%; background:#C9C7BF; }
  #landing .lmeta .d.on { background:#22c55e; }
  #codeBox { margin-top:4px; display:flex; flex-direction:column; gap:12px; }
  #codeBox[hidden] { display:none; }
  #codeBox .ctitle { font-size:17px; font-weight:700; color:var(--muted); word-break:keep-all; }
  #codeInput { height:64px; border:2px solid var(--line); border-radius:16px; text-align:center; font-family:'Pretendard',monospace; font-size:30px; font-weight:800; letter-spacing:.3em; text-transform:uppercase; color:var(--txt); background:#fff; outline:none; }
  #codeInput:focus { border-color:var(--brand); }
  #codeBox .cerr { min-height:20px; font-size:14px; color:#c2410c; word-break:keep-all; }
  #codeBtn { height:54px; border:none; border-radius:14px; background:var(--brand); color:#fff; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  #enterBtn { margin-top:30px; width:100%; height:54px; border:none; border-radius:14px; background:var(--brand); color:#fff; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  /* 오프라인 안내 배너 — 연결이 끊긴 줄 모르고 대기하는 문제 방지 */
  #netBanner { display:none; position:fixed; top:0; left:0; right:0; z-index:80; background:#e8912d; color:#fff;
    text-align:center; padding:calc(7px + env(safe-area-inset-top, 0px)) 10px 7px; font-size:13px; font-weight:700; }
  #netBanner.show { display:block; }
</style>
</head>
<body>
<div id="landing">
  <div class="lcard">
    <div class="lbrand" id="lBrandName" role="img" aria-label="AirTalk">a<span class="i"><span>ı</span><span>i</span></span>rtalk<span class="p">.</span></div>
    <div class="ltitle" id="lTitle">Session</div>
    <div class="lmeta"><span class="d" id="lLiveDot"></span><span id="lLive">Waiting</span></div>
    <button id="enterBtn">Enter</button>
    <!-- 코드 입력(/j): QR 을 못 찍을 때 'airtalk.kr/j' 에서 6자리 참여 코드로 입장 -->
    <form id="codeBox" hidden autocomplete="off">
      <div class="ctitle" id="codeTitle">Enter the join code</div>
      <input id="codeInput" maxlength="6" inputmode="text" autocapitalize="characters" spellcheck="false" aria-label="Join code" />
      <div class="cerr" id="codeErr" role="alert"></div>
      <button id="codeBtn" type="submit">Enter</button>
    </form>
  </div>
</div>
<header>
  <div class="htop">
    <span id="liveDot" role="img" aria-label="Waiting"></span>
    <div class="stitle" id="title">Session</div>
    <!-- 아이콘은 폰 앱과 같은 Lucide 선 아이콘 -->
    <button class="hbtn" id="fsDown" aria-label="Smaller text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 13h6"/><path d="m2 16 4.5-9 4.5 9"/><path d="M18 7v9"/><path d="m14 12 4 4 4-4"/></svg>
    </button>
    <button class="hbtn" id="fsUp" aria-label="Larger text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 13h6"/><path d="m2 16 4.5-9 4.5 9"/><path d="M18 16V7"/><path d="m14 11 4-4 4 4"/></svg>
    </button>
    <button class="hbtn" id="audioBtn" aria-label="Listen" aria-pressed="false" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/><path class="slash" d="M3 3l18 18"/></svg>
    </button>
    <button class="hbtn" id="qrBtn" aria-label="Share via QR code" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
    </button>
  </div>
  <div class="seg" id="langSeg" role="radiogroup" aria-label="My language" hidden></div>
</header>

<div id="feed"><div class="empty" id="empty">Waiting for translation…</div></div>
<div id="partial"></div>


<!-- QR 공유 시트 -->
<div class="backdrop" id="qrBackdrop"></div>
<div class="sheet" id="qrSheet" role="dialog" aria-modal="true" aria-labelledby="qrTitle" aria-hidden="true">
  <div class="grab" aria-hidden="true"></div>
  <button class="qrx" id="qrClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h3 id="qrTitle">Scan to join</h3>
  <p class="hint" id="qrHint"></p>
  <div class="qrframe"><img id="qrImg" alt="QR" hidden /><span class="qmsg" id="qrMsg"></span></div>
  <div id="qrCode" hidden></div>
  <input id="qrLink" type="text" readonly />
  <div class="qbtns">
    <button class="copy" id="qrCopy">Copy link</button>
    <button class="share" id="qrShare" hidden>Share</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const params = new URLSearchParams(location.search);
// 참여 주소 /j/<코드>: 서버가 그 세션 정보를 window.__JOIN 으로 심어 보낸다(2026-10-27). /j 만 열면 코드 입력 화면.
const JOIN = window.__JOIN || {};
const sessionId = JOIN.session || params.get('session') || '';
const token = JOIN.t || params.get('t') || ''; // 뷰어 접근 토큰 — 공개 라우트 접근에 필요
const tq = token ? ('&t=' + encodeURIComponent(token)) : ''; // ws/qr 쿼리용
const tq1 = token ? ('?t=' + encodeURIComponent(token)) : ''; // 첫 쿼리(REST)용
const ALL4 = ['ko','en','ja','zh'];
// 언어 자기 표기(endonym) 폴백 — Intl.DisplayNames 미지원·실패 시
const LABEL = { ko:'한국어', en:'English', ja:'日本語', zh:'中文', es:'Español', fr:'Français', de:'Deutsch', ru:'Русский', vi:'Tiếng Việt', th:'ไทย', id:'Bahasa Indonesia', pt:'Português', it:'Italiano', ar:'العربية', hi:'हिन्दी', tr:'Türkçe', uk:'Українська', pl:'Polski', nl:'Nederlands' };

const $ = (id) => document.getElementById(id);
const feed=$('feed'), empty=$('empty'), partialEl=$('partial'), langSeg=$('langSeg'), titleEl=$('title');
const cards = new Map(); // id -> {el, line, src, texts, source}
let order = []; // 표시 순서 id 목록
let latestId = null;
let curLang = 'ko';
let langKnown = false; // curLang 이 세션 정보로 정해졌는지 — 그 전엔 화면 문구를 폰 언어로
let sessionPipeline = 'whisper';
let sessionOutLang = 'ko';
let sxTwo = false, sxAlang = null, sxBlang = null; // 양방향 번역(언어1↔언어2) — 방향별 색상
let segPair = null; // 세그먼트에 깔린 언어 목록('ko,ja') — 같으면 다시 그리지 않고 선택만 맞춘다
// 양방향: 이 뷰어의 '내 언어'(둘 중 하나). 내 언어로 말한 쪽은 오른쪽에 원문, 상대 언어 쪽은 왼쪽에 내 언어 번역.
// 음성 듣기도 내 언어 음성만 받는다(서버 audioSub.lang). 처음엔 폰 언어로 추정, 고르면 세션별로 기억.
function pickMyLang(a, b){
  try { const sv = localStorage.getItem('kac-mylang-'+sessionId); if (sv === a || sv === b) return sv; } catch {}
  const nav = String(navigator.language || '').slice(0,2).toLowerCase();
  return nav === b ? b : a;
}
let speakerNames = {}; // 화자번호 -> 지정이름
function spkLabel(id){ return id ? (speakerNames[id] || ('Speaker '+id)) : ''; }

/* ---- 화면 문구(UI 언어) ----
   양방향: 내 언어를 따르되 한·일·영만 지원 — 그 외 언어는 영어.
   단방향: 표시 중인 출력 언어가 한·일·영이면 그 언어, 아니면 폰 언어(한·일·영일 때), 그래도 아니면 영어. */
const UI_LANGS = ['ko','ja','en'];
const UI = {
  waiting:  { ko:'번역을 기다리는 중…', ja:'翻訳を待っています…', en:'Waiting for translation…' },
  live:     { ko:'진행 중', ja:'配信中', en:'Live' },
  idle:     { ko:'대기 중', ja:'待機中', en:'Waiting' },
  enter:    { ko:'입장하기', ja:'参加する', en:'Enter' },
  fsDown:   { ko:'글자 작게', ja:'文字を小さく', en:'Smaller text' },

/* ---- 언어 이름 ----
   endonym: 세그먼트용 — 각 언어를 그 언어로(한국어 / 日本語 / English …)
   langName: 말풍선 방향 라벨용 — UI 언어로(일본어 → 한국어 / 韓国語 → 日本語 / Korean → Japanese) */
const LNAME = {
  ko: { ko:'한국어', en:'영어', ja:'일본어', zh:'중국어', es:'스페인어', fr:'프랑스어', de:'독일어', ru:'러시아어', vi:'베트남어', th:'태국어', id:'인도네시아어' },
  ja: { ko:'韓国語', en:'英語', ja:'日本語', zh:'中国語', es:'スペイン語', fr:'フランス語', de:'ドイツ語', ru:'ロシア語', vi:'ベトナム語', th:'タイ語', id:'インドネシア語' },
  en: { ko:'Korean', en:'English', ja:'Japanese', zh:'Chinese', es:'Spanish', fr:'French', de:'German', ru:'Russian', vi:'Vietnamese', th:'Thai', id:'Indonesian' },
};
const ENDO_PREF = { id:'Bahasa Indonesia' }; // CLDR 은 'Indonesia' — 현지에서 흔히 쓰는 표기로
const dnCache = {};
function intlName(code, inLang){
  try {
    if (!window.Intl || !Intl.DisplayNames) return '';
    const dn = dnCache[inLang] || (dnCache[inLang] = new Intl.DisplayNames([inLang], { type:'language' }));
    const s = dn.of(code);
    return (s && s.toLowerCase() !== String(code).toLowerCase()) ? s : ''; // 모르는 코드는 코드 그대로 돌려준다 → 폴백
  } catch { return ''; }
}
function cap1(s, loc){ if (!s) return s; let h; try { h = s.charAt(0).toLocaleUpperCase(loc); } catch { h = s.charAt(0).toUpperCase(); } return h + s.slice(1); }
function endonym(code){
  const c = String(code || ''), b = c.slice(0,2).toLowerCase();
  if (ENDO_PREF[c]) return ENDO_PREF[c];
  return cap1(intlName(c, c) || LABEL[c] || LABEL[b] || c.toUpperCase(), c);
}
function langName(code){
  if (!code) return '';
  const ui = uiLang(), c = String(code), b = c.slice(0,2).toLowerCase();
  const s = intlName(c, ui) || (LNAME[ui][c] || LNAME[ui][b]) || c.toUpperCase();
  return ui === 'en' ? cap1(s, 'en') : s;
}

      sxTwo = true; sxAlang = info.a; sxBlang = info.b;
      curLang = (curLang === info.a || curLang === info.b) && segPair === info.a+','+info.b ? curLang : pickMyLang(info.a, info.b);
      langKnown = true;
      buildSeg([info.a, info.b], (c) => {

      const oldId = order.shift();
      const old = cards.get(oldId);
      if(old){ try { old.el.remove(); } catch {} cards.delete(oldId); }
    }
  }
  card.texts = item.texts || (item.text ? { [curLang]: item.text } : {});
  card.source = item.source || '';
  if (item.lang) card.lang = item.lang; // 발화 언어 — 양방향 정렬(내 언어 쪽/상대 쪽)
  // 확정 메시지는 draft 를 아예 안 보내므로 매번 덮어써야 한다(유지하면 영영 흐린 채로 남는다)
  card.draft = !!item.draft;
  if(item.speaker) card.speaker = item.speaker;
  renderSpk(card);
  renderLine(card); // 보조 줄(원문/번역)까지 renderLine 이 채운다
  applyWhoRuns();
  if(stick) scrollDown();
}
function esc(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
// 화자 구분 표시 제거. 양방향·데스크는 같은 자리(.who)를 방향/역할 라벨로 쓰므로 건드리지 않는다
// (예전엔 speakers 메시지가 오면 그 라벨까지 숨겨졌다)
function renderSpk(c){ if(!c.spk || c.spk.className === 'who') return; c.spk.style.display='none'; }
function rerenderSpk(){ cards.forEach(renderSpk); }
// 선택 언어 번역이 아직 없으면 원문을 흐리게(placeholder)
function renderLine(c){
  if (isDesk()){
    const r = deskTextOf(c);
    c.el.classList.add('turn');
    c.el.classList.toggle('staff', r.staff);
    c.el.classList.toggle('self', !r.staff);
    c.el.classList.remove('latest');
    if (c.spk){ c.spk.className = 'who'; c.spk.style.display = r.t ? '' : 'none'; c.spk.textContent = r.staff ? dt('staff') : (dt('you') + ' · ' + String(curLang).toUpperCase()); }
    c.line.className = 'line' + (c.draft ? ' draft' : ''); // className 통째 교체라 여기서 같이 얹는다
    c.line.textContent = r.t;
    if (c.src) c.src.style.display = 'none';
    c.el.style.display = r.t ? '' : 'none';
    return;
  }
  if (twoMode()) {
    // 발화 언어: 서버가 보낸 lang, 없으면 번역 키로 추정(번역 키=상대 언어 → 말한 언어는 그 반대)
    const tk = c.texts ? Object.keys(c.texts)[0] : null;
    const spoken = c.lang || (tk ? (tk === sxAlang ? sxBlang : sxAlang) : null);
    const mine = spoken === curLang;
    const other = curLang === sxAlang ? sxBlang : sxAlang;
    const tr = c.texts ? (c.texts[mine ? other : curLang] || '') : '';
    let main = mine ? (c.source || tr) : tr;
    const pending = !main && !!c.source; // 상대 말인데 아직 내 언어 번역이 없음 → 원문을 흐리게
    if (pending) main = c.source;
    c.sub = mine ? tr : (pending ? '' : c.source);
    c.el.classList.add('turn');
    c.el.classList.toggle('self', mine);
    c.el.classList.toggle('staff', !mine);
    c.el.classList.remove('latest', 'dirA', 'dirB');
    // 방향 라벨 '말한 언어 → 번역 언어'(UI 언어로): 상대 쪽=말한 언어→내 언어, 내 쪽=내 언어→상대 언어
    const to = mine ? other : curLang;
    if (c.spk){ c.spk.className = 'who'; c.spk.style.display = main ? '' : 'none'; c.spk.textContent = spoken ? (langName(spoken) + ' → ' + langName(to)) : langName(to); }
    c.line.className = 'line' + (pending ? ' pending' : '') + (c.draft ? ' draft' : '');
    c.line.textContent = main;
    c.src.textContent = c.sub || '';
    // 줄마다 언어 표시 — 한국어만 어절 줄바꿈 + 한자 글꼴(일/중) 선택이 맞게
    c.line.lang = pending ? (spoken || '') : curLang;
    c.src.lang = mine ? (other || '') : (spoken || '');
    c.src.style.display = srcShown(c) ? 'block' : 'none';
    c.el.style.display = main ? '' : 'none';
    return;
  }
  // 단방향: 세션 도중 양방향→단방향으로 바뀌어도 말풍선·라벨이 남지 않게 원상 복구
  if (c.el.classList.contains('turn')) {
    c.el.classList.remove('turn', 'self', 'staff'); c.el.style.display = '';
    c.line.removeAttribute('lang'); c.src.removeAttribute('lang');
    if (c.spk) { c.spk.className = 'spk'; c.spk.style.display = 'none'; }
  }
  const txt = pick(c.texts);
  c.line.classList.toggle('pending', !txt && !!c.source);
  c.line.classList.toggle('draft', !!c.draft); // 진행 중 → 회색, 확정되면 제 색으로
  c.line.textContent = txt || c.source || '';
  if (txt) c.line.lang = curLang; else c.line.removeAttribute('lang');
  // 원문은 번역 아래 작은 줄로 항상(표시 문장과 같으면 생략)
  c.src.textContent = c.source || '';
  if (c.lang) c.src.lang = c.lang; // 원문 언어(서버가 보낸 발화 언어) — 한국어면 어절 단위 줄바꿈
  c.src.style.display = srcShown(c) ? 'block' : 'none';
  // 양방향: 저장된 타깃 언어 키로 발화 방향 판별(언어1 발화→texts[언어2], 언어2 발화→texts[언어1])
  c.el.classList.remove('dirA', 'dirB');
  if (sxTwo && c.texts) {
    const tk = Object.keys(c.texts)[0];
    if (tk === sxBlang) c.el.classList.add('dirA');      // 타깃=언어2 → 언어1 발화
    else if (tk === sxAlang) c.el.classList.add('dirB'); // 타깃=언어1 → 언어2 발화
  }
}
// 양방향: 같은 방향('일본어 → 한국어')이 연달아 나오면 첫 말풍선에만 방향 라벨(폰 앱과 같은 규칙)
function applyWhoRuns(){
  if (!twoMode()) return;
  let prev = null;
  for (const id of order) {
    const c = cards.get(id);
    if (!c || !c.spk || c.el.style.display === 'none') continue;
    const lbl = c.spk.textContent;
    c.spk.style.display = lbl && lbl !== prev ? '' : 'none';
    prev = lbl;
  }
}
// 언어를 바꾸면 화면 문구·방향 라벨 언어와 '원문=표시 문장' 여부도 바뀐다
function rerender(){ applyUi(); cards.forEach(renderLine); applySrc(); applyWhoRuns(); }
// 데스크: 대화 종료 시 화면 초기화(다음 손님)
function clearAll(){ cards.forEach(c=>c.el.remove()); cards.clear(); order=[]; latestId=null; setPartial(''); if(empty) empty.style.display=''; }
function setPartial(text){ const s=atBottom(); partialEl.innerHTML = text ? ('<div class="line">'+text.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>') : ''; if(s) scrollDown(); }

/* ---- 번역 음성 재생 (translate, 24kHz PCM16) ---- */
let audioOn = false;
let actx = null;
let outCursor = 0;
let mgain = null; // 마스터 게인(TTS 재생 경로)
let srcNodes = []; // 이 폰에 재생 예약된 음성 조각 — '듣기'를 끄거나 화면으로 돌아오거나 내 언어를 바꾸면 비운다
// 대기열 비우기: 화면이 꺼진 동안 쌓인 음성이 돌아오자마자 한꺼번에(새 음성과 겹쳐) 나오던 것, '듣기'를 꺼도 남은 음성이 계속 나오던 것
function clearAudioQueue(){
  for (const n of srcNodes) { try { n.stop(); } catch {} }
  srcNodes = [];
  outCursor = 0;
}
function enableAudio(){
  // 모바일 자동재생 정책: 사용자 탭(제스처) 안에서 컨텍스트 생성/재개해야 소리가 남
  if(!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); mgain = actx.createGain(); mgain.connect(actx.destination); } catch {} }
  if(actx && actx.state==='suspended') actx.resume();
}
function sendAudioSub(on){ try { if(ws && ws.readyState===1) ws.send(JSON.stringify({type:'audioSub', on:!!on, ...(twoMode() ? { lang: curLang } : {})})); } catch {} }
function playPcm24(b64){
  if(!actx) return;
  try {
    const bin = atob(b64); const n = bin.length>>1;
    const buf = actx.createBuffer(1, n, 24000); const ch = buf.getChannelData(0);
    for(let i=0;i<n;i++){ let s=(bin.charCodeAt(i*2+1)<<8)|bin.charCodeAt(i*2); if(s>=0x8000) s-=0x10000; ch[i]=s/32768; }
    const node = actx.createBufferSource(); node.buffer=buf; node.connect(mgain || actx.destination);
    const now = actx.currentTime; if(outCursor<now) outCursor=now+0.08;
    node.start(outCursor); outCursor += buf.duration;
    srcNodes.push(node);
    node.onended = () => { const i = srcNodes.indexOf(node); if (i >= 0) srcNodes.splice(i, 1); };
  } catch {}
}

/* ---- WS ---- */
let ws;
let refused = false; // 서버가 접속을 거부(정원 초과·IP 상한) — 안내를 띄우고 15초 뒤 다시 시도
let refusedTimer = null;
let lastRx = Date.now(); // 마지막으로 무엇이든 받은 시각 — 서버가 15초마다 hb 를 보낸다
// 끊긴 줄 모르는 '열린 채 죽은' 연결을 버리고 새로 연결(망 전환·절전 복귀 후 브라우저가 close 를 못 받는 경우)
function reconnectNow(){
  const old = ws; ws = null;
  if (old) { try { old.onclose = null; old.close(); } catch {} }
  connect();
}
function connect(){
  // 이미 연결(중)이면 무시 — onclose 재시도와 visibilitychange 가 경합해 소켓이 병렬 누적되던 문제(TTS 이중 재생) 수정
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/viewer?session=${sessionId}${tq}`);
  const cur = ws;
  ws.onopen = () => {
    lastRx = Date.now();
    if(audioOn) sendAudioSub(true); // 재접속 시 구독 복원
  };
  ws.onclose = () => { if (ws === cur) { ws = null; if (!refused) setTimeout(connect, 1200 + Math.random() * 1200); } }; // 지터 — 서버 재시작 시 전체 뷰어 동시 재연결 폭주 방지
  ws.onmessage = (ev) => {
    if (ws === cur) lastRx = Date.now();
    let m; try { m = JSON.parse(ev.data); } catch { return; } // 비 JSON 프레임 방어
    if(m.type==='hb') return; // 서버 생존 신호
    // 서버가 접속을 거부(뷰어 정원 초과·동일 IP 상한): 이유를 보여주고 15초 뒤 다시 시도한다.
    // (예전엔 영구 중단이라, 재접속 순간 옛 연결이 아직 세어져 거부되면 새로고침 전까지 화면이 멈춰 있었다)
    if(m.type==='error'){
      refused = true; setPartial({room_full:T('roomFull'),ip_limit:T('ipLimit')}[m.code] || m.message || T('cantConn')); try { cur.close(); } catch {}
      clearTimeout(refusedTimer); refusedTimer = setTimeout(() => { refused = false; setPartial(''); connect(); }, 15000);
      return;
    }
    if(m.type==='snapshot'){ m.items.forEach(it => upsert(it)); }
    else if(m.type==='partial'){ setPartial(m.text); }
    else if(m.type==='sentence'){ setPartial(''); upsert(m); }
    else if(m.type==='audio'){ if(audioOn) playPcm24(m.b64); }
    else if(m.type==='meta'){ if(sessionPipeline==='soniox' || sessionPipeline==='desk') applySxInfo(m.sxInfo); }
    else if(m.type==='desk-reset'){ clearAll(); }
    else if(m.type==='speakers'){ speakerNames = m.speakers || {}; rerenderSpk(); }
    else if(m.type==='host'){ setHostActive(m.active); }
  };
}
// 호스트(번역) 활성/중지 → 상태 표시등(초록/회색) + 랜딩
function setHostActive(active){
  hostActive = !!active;
  const lbl = hostActive ? T('live') : T('idle');
  $('liveDot').classList.toggle('on', hostActive); $('liveDot').title = lbl; $('liveDot').setAttribute('aria-label', lbl);
  const ld = $('lLiveDot'); if(ld) ld.classList.toggle('on', hostActive);
  const ll = $('lLive'); if(ll) ll.textContent = lbl;
}

/* ---- 조작판 버튼(글자 크기·듣기·QR — 원문은 항상 표시, 다크 모드 없음) ---- */
function stepFs(d){
  const s = atBottom();
  fsPct = Math.min(FS_MAX, Math.max(FS_MIN, fsPct + d)); applyFs();
  toast(T('fsVal') + ' ' + fsPct + '%');
  if (s) scrollDown(); // 맨 아래 보던 중이면 커진 글자에도 최신 문장이 보이게
}
$('fsDown').onclick = () => stepFs(-FS_STEP);
$('fsUp').onclick = () => stepFs(FS_STEP);
$('audioBtn').onclick = () => {
  audioOn = !audioOn; $('audioBtn').classList.toggle('on', audioOn); $('audioBtn').setAttribute('aria-pressed', audioOn ? 'true' : 'false');
  if(audioOn) enableAudio(); else clearAudioQueue(); sendAudioSub(audioOn);
};
$('qrBtn').onclick = openQr;
$('qrClose').onclick = closeQr;
$('qrBackdrop').onclick = closeQr;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('qrSheet').classList.contains('show')) closeQr(); });
// QR 시트: 아래로 쓸어내리면 닫힘(폰 앱의 시트와 같게) — 80px 넘게 내리면 닫고, 덜 내리면 제자리로
(function(){
  const sh = $('qrSheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', (e) => { if (!sh.classList.contains('show') || e.touches.length !== 1) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive:true });
  sh.addEventListener('touchmove', (e) => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = dy ? 'translateY(' + dy + 'px)' : ''; }, { passive:true });
  const end = () => { if (y0 == null) return; y0 = null; sh.style.transition = ''; sh.style.transform = ''; if (dy > 80) closeQr(); };
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
})();
$('qrShare').hidden = !navigator.share;
$('qrShare').onclick = () => { navigator.share({ title: titleEl.textContent || 'AirTalk', url: $('qrLink').value }).catch(() => {}); };
$('qrCopy').onclick = async () => {
  const link = $('qrLink').value;
  try { await navigator.clipboard.writeText(link); } catch { const i=$('qrLink'); i.select(); try { document.execCommand('copy'); } catch {} }
  const b=$('qrCopy'); b.classList.add('done'); b.textContent = T('copied');
  setTimeout(() => { b.classList.remove('done'); b.textContent = T('copy'); }, 1200);
};


// 화면 복귀(휴대폰 절전·앱 전환) 시 즉시 재접속 시도 — 재시도 타이머보다 빠르게 복구
document.addEventListener('visibilitychange', () => {
  // 돌아왔을 때 연결이 닫혔거나, 열려 있어도 20초 넘게 아무것도 못 받았으면(살아 있으면 15초마다 hb) 새로 연결
  if (!document.hidden && !refused) {
    if (!ws || ws.readyState === 3) { try { connect(); } catch {} }
    else if (ws.readyState === 1 && Date.now() - lastRx > 20000) { try { reconnectNow(); } catch {} }
  }
  if (!document.hidden) keepScreenOn();
  // TTS: 잠금/앱 전환으로 AudioContext 가 suspended/interrupted 되면 복귀 시 재개하고
  // 재생 커서를 리셋 — 잠금 시간만큼 밀린 옛 음성이 연달아 재생되던 문제 방지
  if (!document.hidden && audioOn && actx) {
    clearAudioQueue(); // 꺼진 동안 쌓인 음성은 버리고 지금부터 다시 — 새 음성은 현재 시각 기준으로 스케줄
    try { if (actx.state !== 'running') actx.resume(); } catch {}
  }
});
// 브라우저 오류 보고(관리자 시스템 상태) — 60초 스로틀
let __errAt = 0;
window.addEventListener('error', (e) => {
  const t = Date.now(); if (t - __errAt < 60000) return; __errAt = t;
  try { fetch('/api/client-log', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ msg: 'mobile: ' + e.message, src: (e.filename||'') + ':' + (e.lineno||0) }) }); } catch {}
});

applyUi();
applySrc();
if (!sessionId) {
  // 코드 입력 화면(/j, 또는 틀린 코드) — 세션이 없으니 연결하지 않는다
  ['lTitle', 'enterBtn'].forEach((id) => { $(id).style.display = 'none'; });
  document.querySelector('#landing .lmeta').style.display = 'none';
  $('codeBox').hidden = false;
  if (JOIN.notFound) { $('codeInput').value = String(JOIN.code || '').toUpperCase(); $('codeErr').textContent = JOIN.blocked ? T('codeBlocked') : T('codeNotFound'); }
  $('codeInput').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^0-9A-Z]/g, ''); $('codeErr').textContent = ''; });
  $('codeBox').addEventListener('submit', (e) => {
    e.preventDefault();
    const c = $('codeInput').value.trim().toUpperCase();
    if (c.length !== 6) { $('codeErr').textContent = T('codeTitle'); return; }
    location.href = '/j/' + c;
  });
  setTimeout(() => { try { $('codeInput').focus(); } catch {} }, 100);
} else {
  loadSession();
  loadQr();
  connect();
  // 감시: 열린 연결인데 35초 동안 아무것도 못 받으면(생존 신호 2번 놓침) 죽은 연결로 보고 새로 연결
  setInterval(() => {
    if (!refused && ws && ws.readyState === 1 && Date.now() - lastRx > 35000) { try { reconnectNow(); } catch {} }
  }, 5000);
}
</script>
<script>
/* 인터넷 연결 감지 — 끊기면 상단 배너, 복구되면 자동 숨김(WS 재연결 로직이 이어받음). 문구는 UI 언어(applyUi 가 갱신) */
(function(){
  var b = document.createElement('div'); b.id = 'netBanner'; b.setAttribute('role', 'status');
  b.textContent = (typeof T === 'function') ? T('offline') : 'No internet connection. It will resume automatically once you’re back online.';
  document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(b); if(!navigator.onLine) b.classList.add('show'); });
  window.addEventListener('offline', function(){ b.classList.add('show'); });
  window.addEventListener('online', function(){ b.classList.remove('show'); });
})();
</script>
